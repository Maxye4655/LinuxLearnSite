<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interactive Educational Website</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <!-- Light Rays -->
    <div class="light-rays" aria-hidden="true"></div>

    <!-- Big Bubbles -->
    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>
    <!-- Small Bubbles -->
    <div class="bubble bubble4"></div>
    <div class="bubble bubble5"></div>
    <div class="bubble bubble6"></div>
    <div class="bubble bubble7"></div>
    <div class="bubble bubble8"></div>
    <div class="bubble bubble9"></div>
    <div class="bubble bubble10"></div>
    <!-- Extra Glass Spheres -->
    <div class="bubble bubble11"></div>
    <div class="bubble bubble12"></div>
    <div class="bubble bubble13"></div>

    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-bubble nav-bubble-a" aria-hidden="true"></div>
      <div class="nav-bubble nav-bubble-b" aria-hidden="true"></div>
      <a href="#" class="logo">LinuxLearn</a>
      <div class="nav-links">
        <a href="#lessons">Lessons</a>
        <a href="#challenges">Challenges</a>
        <a href="#about">About</a>
      </div>
    </nav>

    <div class="container">
      <main class="card" role="main">
        <section class="hero">
          <div class="hero-text">
            <h1>Learn Linux</h1>
            <p class="subtitle">WORDSWORDSWORDSWORDS</p>
            <p class="description">
              WORDSWORDSWORDSWORDSW
              ORDSWORDSWORDSWORDSWO
              RDSWORDSWORDSWORDSWOR
              SWORDSWORDSWORDSWORDS
              SWORDSWORDSWORDSWORDS
            </p>
            <a href="#lessons" class="banner-button">Get Started</a>
          </div>
          <div class="hero-art">
            <img src="images/tux.svg" alt="Tux, the Linux mascot" />
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
